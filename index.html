<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OOO Simulation Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden; font-family: monospace;
  }
  #gameCanvas { display: block; image-rendering: pixelated; touch-action: none; }
  #presetBar {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 10;
  }
  .presetBtn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22);
    color: #fff; font-family: 'Courier New', monospace; font-size: 10px;
    padding: 5px 10px; cursor: pointer; border-radius: 4px; letter-spacing: 1px;
    transition: background 0.2s;
  }
  .presetBtn:hover { background: rgba(255,255,255,0.16); }
  .presetBtn.active { border-color: #0f0; color: #0f0; }
</style>
</head>

<canvas id="gameCanvas"></canvas>
<div id="presetBar">

</div>

// AUDIO
let audioCtx;
function ensureAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  try{
    ensureAudio();
    const g=audioCtx.createGain(); g.connect(audioCtx.destination);
    const o=audioCtx.createOscillator(); o.connect(g);
    const t=audioCtx.currentTime;
    if(type==='bodyHit'){
      o.type='square'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(70,t+0.07);
      g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      o.start(); o.stop(t+0.08);
    }else if(type==='weaponHit'){
      o.type='sawtooth'; o.frequency.setValueAtTime(550,t); o.frequency.exponentialRampToValueAtTime(130,t+0.15);
      g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.17);
      o.start(); o.stop(t+0.17);
    }else if(type==='tipClash'){
      o.type='sine'; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(400,t+0.1);
      g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.start(); o.stop(t+0.12);
    }else if(type==='wall'){
      o.type='sine'; o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(180,t+0.06);
      g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
      o.start(); o.stop(t+0.07);
    }else if(type==='win'){
      [523,659,784,1047].forEach((f,i)=>{
        const ow=audioCtx.createOscillator(),gw=audioCtx.createGain();
        ow.connect(gw); gw.connect(audioCtx.destination);
        ow.type='square'; ow.frequency.value=f;
        const tt=t+i*0.12;
        gw.gain.setValueAtTime(0.15,tt); gw.gain.exponentialRampToValueAtTime(0.001,tt+0.22);
        ow.start(tt); ow.stop(tt+0.22);
      });
    }
  }catch(e){}
}

// PARTICLE
class Particle{
  constructor(x,y,vx,vy,color,life,size){
    Object.assign(this,{x,y,vx,vy,color,life,maxLife:life,size:size||3,gravity:0.12});
  }
  update(){ this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.vx*=0.97;this.life--; }
  draw(){
    const a=this.life/this.maxLife;
    ctx.save(); ctx.globalAlpha=a; ctx.shadowColor=this.color; ctx.shadowBlur=6;
    ctx.fillStyle=this.color;
    ctx.fillRect((this.x-this.size/2)*scale,(this.y-this.size/2)*scale,this.size*scale,this.size*scale);
    ctx.restore();
  }
}

// DAMAGE NUMBER
class DamageNumber{
  constructor(x,y,dmg,color){ Object.assign(this,{x,y,dmg,color,life:62,maxLife:62,vy:-2.4}); }
  update(){ this.y+=this.vy; this.vy*=0.93; this.life--; }
  draw(){
    ctx.save(); ctx.globalAlpha=this.life/this.maxLife;
    ctx.shadowColor=this.color; ctx.shadowBlur=14;
    ctx.fillStyle=this.color;
    ctx.font=`bold ${Math.round(16*scale)}px 'Courier New',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('-'+this.dmg,this.x*scale,this.y*scale);
    ctx.restore();
  }
}

// DRAW WEAPON — image at arm tip, rotates with ball
function drawWeaponImg(cx,cy,angle,cfg){
  const img=IMG[cfg.imgKey];
  if(!img||!img.complete) return;
  const s=scale, L=cfg.armLen*s, sz=cfg.imgSize*s;
  ctx.save();
  ctx.translate(cx*s,cy*s);
  ctx.rotate(angle);
  // thin arm
  ctx.strokeStyle='rgba(120,90,50,0.5)';
  ctx.lineWidth=2*s; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(L,0); ctx.stroke();
  // weapon image at tip
  ctx.translate(L,0);
  ctx.rotate(cfg.imgAngle);  // fixed tilt so weapon looks natural
  ctx.drawImage(img,-sz/2,-sz/2,sz,sz);
  ctx.restore();
}

// FIGHTER
class Fighter{
  constructor(cfg,x,y,arena,isLeft){
    Object.assign(this,{
      name:cfg.name,color:cfg.color,maxHp:cfg.hp,hp:cfg.hp,displayHp:cfg.hp,
      damage:cfg.damage,baseSpeed:cfg.speed,knockback:cfg.knockback,label:cfg.label,
      arena,armLen:cfg.armLen,rotSpeed:cfg.rotSpeed,cfg,
      x,y,r:26,tipR:9,
      angle:isLeft?0.3:Math.PI+0.3,
      vx:0,vy:0,
      alive:true,dead:false,deathProgress:0,
      glowPulse:0,hitFlash:0,scaleX:1,scaleY:1,trail:[],
      weapHitCooldown:0,bodyHitCooldown:0,tipClashCooldown:0
    });
    const spd=cfg.speed*(1.6+Math.random()*0.8), a=Math.random()*Math.PI*2;
    this.vx=Math.cos(a)*spd; this.vy=Math.sin(a)*spd;
  }
  tipX(){ return this.x+Math.cos(this.angle)*this.armLen; }
  tipY(){ return this.y+Math.sin(this.angle)*this.armLen; }
  update(){
    if(this.dead){ this.deathProgress=Math.min(1,this.deathProgress+0.022); return; }
    if(!this.alive) return;
    this.displayHp+=(this.hp-this.displayHp)*0.12;
    this.scaleX+=(1-this.scaleX)*0.18; this.scaleY+=(1-this.scaleY)*0.18;
    this.glowPulse*=0.88; this.hitFlash=Math.max(0,this.hitFlash-1);
    if(this.weapHitCooldown>0) this.weapHitCooldown--;
    if(this.bodyHitCooldown>0) this.bodyHitCooldown--;
    if(this.tipClashCooldown>0) this.tipClashCooldown--;
    this.angle+=this.rotSpeed;
    this.x+=this.vx; this.y+=this.vy;
    const A=this.arena;
    if(this.x-this.r<A.x){  this.x=A.x+this.r;  this.vx= Math.abs(this.vx); shakeX=(Math.random()-0.5)*4; playSound('wall'); }
    if(this.x+this.r>A.x+A.w){this.x=A.x+A.w-this.r;this.vx=-Math.abs(this.vx); shakeX=(Math.random()-0.5)*4; playSound('wall'); }
    if(this.y-this.r<A.y){  this.y=A.y+this.r;  this.vy= Math.abs(this.vy); shakeY=(Math.random()-0.5)*4; playSound('wall'); }
    if(this.y+this.r>A.y+A.h){this.y=A.y+A.h-this.r;this.vy=-Math.abs(this.vy); shakeY=(Math.random()-0.5)*4; playSound('wall'); }
    const spd=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    const maxS=this.baseSpeed*5,minS=this.baseSpeed*1.4;
    if(spd>maxS){this.vx=this.vx/spd*maxS;this.vy=this.vy/spd*maxS;}
    if(spd<minS&&spd>0.05){this.vx=this.vx/spd*minS;this.vy=this.vy/spd*minS;}
    this.trail.push({x:this.x,y:this.y,t:7});
    if(this.trail.length>7) this.trail.shift();
    this.trail.forEach(p=>p.t--);
    this.trail=this.trail.filter(p=>p.t>0);
  }
  takeDamage(dmg,kbx,kby){
    this.hp=Math.max(0,this.hp-dmg);
    this.vx+=kbx; this.vy+=kby;
    this.glowPulse=1; this.hitFlash=12;
    this.scaleX=1.38; this.scaleY=0.68;
    if(this.hp<=0){ this.alive=false; setTimeout(()=>this.dead=true,260); }
  }
  draw(){
    if(this.dead){ ctx.save(); ctx.globalAlpha=Math.max(0,1-this.deathProgress); this._drawAll(); ctx.restore(); return; }
    if(!this.alive) return;
    this._drawAll();
  }
  _drawAll(){
    const x=this.x*scale,y=this.y*scale,r=this.r*scale;
    this.trail.forEach((p,i)=>{
      ctx.save(); ctx.globalAlpha=(i/this.trail.length)*0.13;
      ctx.beginPath(); ctx.arc(p.x*scale,p.y*scale,r*0.8,0,Math.PI*2);
      ctx.fillStyle=this.color; ctx.fill(); ctx.restore();
    });
    // weapon UNDER ball
    drawWeaponImg(this.x,this.y,this.angle,this.cfg);
    // ball body
    ctx.save();
    ctx.translate(x,y); ctx.scale(this.scaleX,this.scaleY);
    ctx.shadowColor=this.color; ctx.shadowBlur=(18+this.glowPulse*24)*scale;
    const fc=this.hitFlash>0?'#fff':this.color;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.strokeStyle=fc; ctx.lineWidth=2.5*scale; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r-2*scale,0,Math.PI*2);
    const grad=ctx.createRadialGradient(-r*0.3,-r*0.3,0,0,0,r);
    grad.addColorStop(0,this.hitFlash>0?'#fff':lighten(this.color,0.4));
    grad.addColorStop(1,this.color+'88');
    ctx.fillStyle=grad; ctx.fill(); ctx.restore();
    // HP number
    ctx.save(); ctx.shadowColor=this.color; ctx.shadowBlur=8*scale;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.round(14*scale)}px 'Courier New',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(Math.ceil(this.displayHp),x,y);
    ctx.restore();
  }
}

// HELPERS
function lighten(hex,amt){
  let c=parseInt(hex.replace('#',''),16);
  return `rgb(${Math.min(255,((c>>16)&0xff)+Math.round(amt*255))},${Math.min(255,((c>>8)&0xff)+Math.round(amt*255))},${Math.min(255,(c&0xff)+Math.round(amt*255))})`;
}
function pixelFont(sz){ return `bold ${Math.round(sz*scale)}px 'Courier New',monospace`; }
function ddist(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function spawnParticles(x,y,color,count,spd=1){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=(2+Math.random()*5)*spd;
    particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,Math.random()<0.5?color:'#fff',18+Math.random()*20,2+Math.random()*3));
  }
}
function spawnDeathBurst(x,y,color){
  for(let i=0;i<75;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*10;
    particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,[color,'#fff','#ffff00','#ff4400'][Math.floor(Math.random()*4)],42+Math.random()*48,2+Math.random()*5));
  }
}

// GAME STATE
let particles=[],damageNumbers=[];
let shakeX=0,shakeY=0,freezeFrames=0;
let roundOver=false,winnerName='',winnerColor='',roundDelay=0,roundCount=0,winnerGlow=0;
let arena,fighters;

function initRound(idx){
  const P=PRESETS[idx];
  roundOver=false; winnerName=''; particles=[]; damageNumbers=[];
  shakeX=0; shakeY=0; freezeFrames=0;
  const aw=BASE_W-40,ah=BASE_H*0.52,ax=20,ay=BASE_H*0.17;
  arena={x:ax,y:ay,w:aw,h:ah};
  const lc={...P.left, damage:P.left.damage+Math.round((Math.random()-0.5)*4)};
  const rc={...P.right,damage:P.right.damage+Math.round((Math.random()-0.5)*4)};
  fighters=[
    new Fighter(lc,ax+aw*0.28,ay+ah*0.68,arena,true),
    new Fighter(rc,ax+aw*0.72,ay+ah*0.32,arena,false)
  ];
  roundCount++;
}

// COLLISION
function resolveCollisions(){
  const a=fighters[0],b=fighters[1];
  if(!a.alive||!b.alive) return;
  const tipAx=a.tipX(),tipAy=a.tipY(),tipBx=b.tipX(),tipBy=b.tipY(),tipR=9;

  const d_tA_bB=ddist(tipAx,tipAy,b.x,b.y);
  if(d_tA_bB<tipR+b.r&&a.weapHitCooldown===0){
    const nx=(b.x-tipAx)/d_tA_bB,ny=(b.y-tipAy)/d_tA_bB,KB=b.knockback*2.4;
    b.takeDamage(5,nx*KB,ny*KB); a.vx-=nx*2; a.vy-=ny*2; a.weapHitCooldown=24;
    const hx=b.x-nx*b.r,hy=b.y-ny*b.r;
    damageNumbers.push(new DamageNumber(hx+nx*15,hy+ny*15,5,b.color));
    spawnParticles(hx,hy,a.color,20,1.5); playSound('weaponHit');
    shakeX=(Math.random()-0.5)*11; shakeY=(Math.random()-0.5)*11;
    freezeFrames=4; a.scaleX=0.72; a.scaleY=1.32;
  }

  const d_tB_bA=ddist(tipBx,tipBy,a.x,a.y);
  if(d_tB_bA<tipR+a.r&&b.weapHitCooldown===0){
    const nx=(a.x-tipBx)/d_tB_bA,ny=(a.y-tipBy)/d_tB_bA,KB=a.knockback*2.4;
    a.takeDamage(5,nx*KB,ny*KB); b.vx-=nx*2; b.vy-=ny*2; b.weapHitCooldown=24;
    const hx=a.x-nx*a.r,hy=a.y-ny*a.r;
    damageNumbers.push(new DamageNumber(hx+nx*15,hy+ny*15,5,a.color));
    spawnParticles(hx,hy,b.color,20,1.5); playSound('weaponHit');
    shakeX=(Math.random()-0.5)*11; shakeY=(Math.random()-0.5)*11;
    freezeFrames=4; b.scaleX=0.72; b.scaleY=1.32;
  }

  const d_bodies=ddist(a.x,a.y,b.x,b.y),minBody=a.r+b.r;
  if(d_bodies<minBody&&d_bodies>0.5){
    const nx=(b.x-a.x)/d_bodies,ny=(b.y-a.y)/d_bodies,ov=(minBody-d_bodies)*0.52;
    a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){a.vx+=nx*rv;a.vy+=ny*rv;b.vx-=nx*rv;b.vy-=ny*rv;}
    if(a.bodyHitCooldown===0&&b.bodyHitCooldown===0){
      const hx=a.x+nx*a.r,hy=a.y+ny*a.r;
      a.takeDamage(1,-nx*1.2,-ny*1.2); b.takeDamage(1,nx*1.2,ny*1.2);
      a.bodyHitCooldown=35; b.bodyHitCooldown=35;
      damageNumbers.push(new DamageNumber(hx-nx*10,hy-ny*10,1,a.color));
      damageNumbers.push(new DamageNumber(hx+nx*10,hy+ny*10,1,b.color));
      spawnParticles(hx,hy,'#fff',8,0.8); playSound('bodyHit');
      shakeX=(Math.random()-0.5)*5; shakeY=(Math.random()-0.5)*5;
    }
  }

  const d_tips=ddist(tipAx,tipAy,tipBx,tipBy);
  if(d_tips<tipR*2&&d_tips>0.1&&a.tipClashCooldown===0&&b.tipClashCooldown===0){
    const nx=(tipBx-tipAx)/d_tips,ny=(tipBy-tipAy)/d_tips,imp=2.0;
    a.vx-=nx*imp; a.vy-=ny*imp; b.vx+=nx*imp; b.vy+=ny*imp;
    a.rotSpeed*=-1; b.rotSpeed*=-1;
    a.tipClashCooldown=20; b.tipClashCooldown=20;
    spawnParticles((tipAx+tipBx)/2,(tipAy+tipBy)/2,'#ffff55',10,1.0);
    playSound('tipClash'); shakeX=(Math.random()-0.5)*5; shakeY=(Math.random()-0.5)*5;
  }
}

// DRAW
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function drawArena(){
  const A=arena,x=A.x*scale,y=A.y*scale,w=A.w*scale,h=A.h*scale,r=16*scale;
  const vig=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*0.2,canvas.width/2,canvas.height/2,canvas.height*0.8);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.shadowColor='rgba(255,255,255,0.1)'; ctx.shadowBlur=20*scale;
  ctx.strokeStyle='rgba(255,255,255,0.48)'; ctx.lineWidth=1.5*scale;
  roundRect(ctx,x,y,w,h,r); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.022; ctx.fillStyle='#fff';
  for(let sy=y;sy<y+h;sy+=4*scale) ctx.fillRect(x,sy,w,1.5*scale);
  ctx.restore();
}

function drawStatusBar(){
  const A=arena,by=(A.y+A.h+18)*scale,barW=(BASE_W-40)*scale,barH=6*scale,barX=20*scale;

  const rp=Math.max(0,fighters[1].hp/fighters[1].maxHp);
  const rbX=barX+barW*0.55,rw=barW*0.45*rp;
  const g1=ctx.createLinearGradient(rbX+barW*0.45,0,rbX,0);
  g1.addColorStop(0,fighters[1].color); g1.addColorStop(1,fighters[1].color+'44');
  ctx.fillStyle=g1; ctx.fillRect(rbX+barW*0.45-rw,by,rw,barH);
  ctx.fillStyle='#fff'; ctx.fillRect(barX+barW*0.475,by-barH*0.5,barW*0.05,barH*2);

  const ty2=ty+13;

  ctx.fillText(`Green [${P.left.label}: ${fighters[0].damage}]`,22*scale,ty2*scale); ctx.restore();
  ctx.save(); ctx.font=pixelFont(7); ctx.textAlign='right'; ctx.fillStyle=fighters[1].color+'bb';
  ctx.fillText(`Blue [${P.right.label}: ${fighters[1].damage}]`,(BASE_W-22)*scale,ty2*scale); ctx.restore();

// MAIN LOOP
let lastTime=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastTime<14) return; lastTime=ts;
  if(imagesLoaded<totalImages){ drawLoading(); return; }
  if(freezeFrames>0){ freezeFrames--; return; }
  shakeX*=0.7; shakeY*=0.7;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(shakeX*scale,shakeY*scale);
  drawWatermark(); drawArena(); drawHeader();
  if(!roundOver){
    fighters.forEach(f=>f.update());
    resolveCollisions();
    const aDead=!fighters[0].alive,bDead=!fighters[1].alive;
    if(aDead||bDead){
      roundOver=true;
      const winner=aDead?fighters[1]:fighters[0],loser=aDead?fighters[0]:fighters[1];
      winnerName=winner.name; winnerColor=winner.color;
      spawnDeathBurst(loser.x,loser.y,loser.color);
      playSound('win'); roundDelay=230; winnerGlow=0;
    }
  } else {
    fighters.forEach(f=>f.update());
    if(--roundDelay<=0) initRound(currentPreset);
  }
  fighters.forEach(f=>f.draw());
  particles.forEach(p=>{p.update();p.draw();}); particles=particles.filter(p=>p.life>0);
  damageNumbers.forEach(d=>{d.update();d.draw();}); damageNumbers=damageNumbers.filter(d=>d.life>0);
  drawStatusBar();
  ctx.restore();
  if(roundOver) drawWinnerScreen();
}

function selectPreset(idx){
  currentPreset=idx;
  document.querySelectorAll('.presetBtn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  initRound(idx);
}
canvas.addEventListener('click',()=>ensureAudio());
initRound(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
